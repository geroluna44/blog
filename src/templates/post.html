<article class="post-full">
  <h1>{{title}}</h1>
  <time class="post-date" datetime="{{isoDate}}">{{date}}</time>
  {{#tags}}<a class="tag" href="tags/{{slug}}/">{{name}}</a> {{/tags}}
  <div class="post-content">
    {{content}}
  </div>
</article>
<footer class="post-footer" aria-label="Contacto">
  {{contact}}
</footer>
