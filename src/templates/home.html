<section class="home-description" aria-label="Sobre el blog">
  <p>{{blogDescription}}</p>
</section>

<section class="home-recent" aria-label="Entradas recientes">
  <h2 class="home-recent-title">Entradas recientes</h2>
  {{previews}}
</section>

<p class="home-more"><a class="more-link" href="{{blogUrl}}">Más</a></p>

<section class="home-tags" aria-label="Etiquetas">
  <h2 class="home-tags-title">Tags</h2>
  <div class="tags-strip" data-tags-strip>
    <button class="tags-arrow" type="button" data-dir="prev" aria-label="Etiquetas anteriores">‹</button>
    <div class="tags-viewport">
      <div class="tags-track">{{tags}}</div>
    </div>
    <button class="tags-arrow" type="button" data-dir="next" aria-label="Etiquetas siguientes">›</button>
  </div>
</section>
